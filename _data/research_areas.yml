# Research areas, shown as keyword chips under the name on the home page and
# as a "Research areas" card that explains each one.
# Each entry needs: id (anchor), chip (short label), name, keywords (list),
#                   method (a short paragraph on methodology), tech (list)
# Optional: tone (icon colour), icon

- id: ai
  chip: AI
  name: AI for Networked Systems
  tone: green
  icon: lightbulb
  keywords: [Deep reinforcement learning, Multi-objective optimisation, Language agents, Intent-based networking]
  method: >-
    I use learning where analytical models are too costly: multi-objective deep
    reinforcement learning for edge-cloud server selection (more than 60% routing
    improvement over classical heuristics), and language agents that turn clinicians'
    natural-language intents into orchestration of medical IoT devices over MCP on an
    SDN hospital network (LLMThings, HOPPERS).
  tech: [Python, TensorFlow, OpenAI Gym, NumPy, CrewAI, LangChain, LangGraph, Model Context Protocol, RAG]

- id: dp
  chip: Differential Privacy
  name: Differential Privacy for Location Data
  tone: amber
  icon: map-pin
  keywords: [Geo-indistinguishability, GPS obfuscation, Location privacy-preserving mechanisms, Multimodal transportation, Privacy–utility trade-off]
  method: >-
    Location-based services collect GPS traces from which homes, workplaces and transport
    modes can be inferred. During my M1 internship at the University of Porto, I built a
    context-aware pipeline
    that first splits real-world trajectories by transport mode, then obfuscates each GPS
    point with calibrated noise using four geo-indistinguishability mechanisms (Planar
    Laplace, Adaptive, Clustering and Velocity-Aware Geo-Ind), and finally scores privacy
    and utility, such as average quality loss in metres. Adapting the mechanism to the
    context pays off: Velocity-Aware Geo-Ind often stays below 50 m of distortion across
    all modes, against about 120 m for the Planar Laplace baseline.
  tech: [Python, Privkit, NumPy, pandas, Matplotlib, Geolife dataset]

- id: blockchain
  chip: Blockchain
  name: Blockchain for Health Data
  tone: violet
  icon: database
  keywords: [Sui, Move smart contracts, Walrus, Electronic health records, Genomic data sharing]
  method: >-
    I design platforms where hospitals, laboratories and patients share electronic health
    records and genomic data without a central custodian. Access policies and audit trails
    live in Sui Move smart contracts, while the encrypted records themselves are stored
    off-chain on Walrus, Sui's decentralised blob storage, and referenced on-chain by
    content identifier. This keeps large medical files out of the ledger while every
    access stays traceable.
  tech: [Sui, Move, Walrus decentralised storage, Sui CLI]

- id: zkp
  chip: ZKP
  name: Zero-Knowledge Proofs
  tone: rose
  icon: badge-check
  keywords: [Zero-knowledge smart contracts, Selective disclosure, Commitments and nullifiers, Threshold proofs]
  method: >-
    Zero-knowledge proofs let a party prove a statement about private data without
    revealing the data. I compare ZKP constructions for multi-party genomic data sharing,
    and use them for selective disclosure of health records (prove a clinical attribute,
    hide the rest), privacy-preserving aggregated biomedical analysis, and anonymous
    threshold reporting in SafeProof.
  tech: [zk-SNARKs, ZKContract on Sui, Commitments, Nullifiers, JavaScript]

- id: tsn
  chip: TSN
  name: Time-Sensitive Networking
  tone: teal
  icon: globe
  keywords: [IEEE 802.1 TSN, Deterministic Ethernet, Traffic shaping, Runtime reconfiguration]
  method: >-
    I model TSN switches and their shapers (credit-based, time-aware, asynchronous) as
    service curves, then study how stream admission, rerouting and schedule updates
    change the worst-case delay of every flow. The goal is a reconfiguration procedure
    that is certified before it is applied, so latency guarantees hold during and after
    the change.
  tech: [IEEE 802.1Qav, IEEE 802.1Qbv, IEEE 802.1Qcr, Industrial and in-vehicle networks, AFDX]

- id: nc
  chip: Network Calculus
  name: Network Calculus
  tone: blue
  icon: braces
  keywords: [Deterministic network calculus, Arrival and service curves, Min-plus algebra, Worst-case latency, Formal bounds]
  method: >-
    Deterministic network calculus bounds the worst-case delay and backlog of a flow from
    arrival curves (what a source may send) and service curves (what a node guarantees),
    using min-plus algebra. Unlike measurement or simulation, which only observe a lower
    bound on the worst case, these bounds are proofs. I use them as the certification
    layer of my thesis and maintain open course material on the topic.
  tech: [NetworkCalculus.org DNC, AFDX network analysis tools, Python, Quarto]

- id: iot-sdn
  chip: IoT &amp; SDN
  name: IoT &amp; Software-Defined Networking
  tone: violet
  icon: building
  keywords: [Medical IoT, Software-defined networking, OpenFlow, Intent-based orchestration, Smart hospitals]
  method: >-
    I design secure infrastructures that collect data from medical IoT devices over
    software-defined hospital networks, where a central controller programs forwarding
    and isolation policies. On top of this, language agents translate clinicians' intents
    into device and network actions through standardised MCP interfaces (HOPPERS,
    LLMThings). Prototypes are emulated in Mininet-WiFi before any deployment.
  tech: [Python, Mininet-WiFi, OpenFlow, ONOS, Model Context Protocol, FastAPI, Next.js]
