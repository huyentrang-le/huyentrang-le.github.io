# Learning materials, shown on the Learning Materials page.
# Three categories (lab notes, course materials, certificates); each holds groups,
# and each group holds items.
# Category: id, title, icon (from _includes/icons.svg), tone (blue, teal, green, amber, rose, violet),
#           item_icon (icon shown next to each item's name), groups
# Group: title, items. Optional: term, place
# Item: title. Optional: course (bold label), icon (overrides the category's item icon), term,
#       description (HTML allowed), links (list of {label, url}), labs (list of {name, tools}) for sub-entries

- id: lab-notes
  title: Lab notes
  icon: notebook
  tone: teal
  item_icon: notebook
  groups:
    - title: "Certified reconfiguration of TSN networks (PhD)"
      place: "Cnam & ECE"
      term: 2026–present
      items:
        - course: Network Calculus Notes
          title: A learning series on network calculus applied to TSN
          description: >-
            Nine parts: from why TSN needs deterministic guarantees, through min-plus
            algebra, arrival and service curves, the fundamental bounds, concatenation,
            aggregate multiplexing and TSN shapers, to dynamic reconfiguration.
          links:
            - label: Read the notes
              url: https://cnam-ece.github.io/learning-materials/blog/why-deterministic-guarantees
            - label: GitHub
              url: https://github.com/CNAM-ECE
    - title: "Blockchain and zero-knowledge proofs"
      place: "IBISC, Université d'Évry Paris-Saclay"
      term: 2025–2026
      items:
        - course: dApp learning
          title: Courses towards Web3 and blockchain application development
          term: 2026
          links:
            - label: Repository
              url: https://github.com/huyentrang-le/dApp-learning
    - title: "Deep reinforcement learning for edge-cloud systems"
      place: "BKCS Lab, HUST"
      term: 2023–2024
      items:
        - course: BKCS
          title: SDN research notes, papers and Mininet demos
          description: >-
            Learning materials behind my engineering thesis and the IEEE Cloud Summit 2024
            paper on multi-objective deep reinforcement learning for edge-cloud server selection.
          links:
            - label: Learning materials
              url: https://github.com/huyentrang-le/BKCS
            - label: Paper source code
              url: https://github.com/TranLabScholars/mec_multi-objective_drl
            - label: Reference implementation
              url: https://github.com/huyentrang-le/mec_morl_multipolicy
- id: courses
  title: Course materials
  icon: graduation-cap
  tone: blue
  item_icon: book-open
  groups:
    - title: "Master 2 Computer Networks (CNS-SR)"
      place: "Université d'Évry Paris-Saclay"
      term: 2025–2026
      items:
        - course: Course materials
          title: Notes, labs and project materials from the Master's programme
          links:
            - label: Google Drive folder
              url: https://drive.google.com/drive/folders/1IMzrzbUl9l7tAaeWfGr61ObpcdPIdMf8?usp=sharing
        - course: Network systems labs
          title: Hands-on labs from the network systems track
          icon: flask
          labs:
            - name: High availability and LAN routing
              tools: '<a href="https://www.openbsd.org/" target="_blank" rel="noopener">OpenBSD</a> with <a href="https://www.openbsd.org/faq/pf/carp.html" target="_blank" rel="noopener">CARP and PFSYNC</a>; redundant DHCP servers'
            - name: Load balancing
              tools: 'LVS + <a href="https://www.keepalived.org/" target="_blank" rel="noopener">Keepalived</a> load-balanced clusters'
            - name: NAT and packet filtering
              tools: '<a href="https://www.netfilter.org/" target="_blank" rel="noopener">Netfilter</a>, <a href="https://www.wireshark.org/" target="_blank" rel="noopener">Wireshark</a> and tcpdump'
            - name: Data-centre networking
              tools: 'Multi-site network with VLANs, LACP, MLAG and VRRP on <a href="https://docs.nvidia.com/networking-ethernet-software/cumulus-linux/" target="_blank" rel="noopener">Cumulus Linux</a>, automated with <a href="https://www.ansible.com/" target="_blank" rel="noopener">Ansible</a>'
            - name: Database migration
              tools: 'SQL to <a href="https://www.mongodb.com/" target="_blank" rel="noopener">MongoDB</a> on <a href="https://podman.io/" target="_blank" rel="noopener">Podman</a>'
            - name: Software-defined networking
              tools: '<a href="https://www.opendaylight.org/" target="_blank" rel="noopener">OpenDaylight</a>, <a href="https://opennetworking.org/onos/" target="_blank" rel="noopener">ONOS</a> and <a href="https://github.com/noxrepo/pox" target="_blank" rel="noopener">POX</a> controllers on <a href="https://mininet.org/" target="_blank" rel="noopener">Mininet</a>'
