# Research topics, shown as cards on the Research page; the first three are
# also listed on the home page. Links to papers, code, slides and demos live
# in the publication entries (assets/ref.bib), not here.
# Each entry needs: title, keywords (list), summary (one line, for the home page),
#                   description (a short paragraph)

- title: "Certified Dynamic Reconfiguration of TSN Networks"
  keywords: [Time-Sensitive Networking, Network calculus, Worst-case latency, Dynamic reconfiguration]
  summary: "Provable worst-case latency bounds that stay certified while TSN networks are reconfigured."
  description: >-
    Time-Sensitive Networking (TSN) promises bounded latency, but measurements only show
    a lower bound on the worst-case delay. My PhD uses deterministic network calculus to
    prove worst-case latency bounds and to keep them certified when the network is
    reconfigured at runtime.

- title: "Secure Genomic Data Sharing with Zero-Knowledge Proofs"
  keywords: [Blockchain, Zero-knowledge proofs, Genomic data, Privacy]
  summary: "Zero-knowledge proofs for multi-party genomic data sharing on blockchain."
  description: >-
    Blockchain-based platforms for sharing genomic data among multiple parties while
    protecting participants' identities. This work analyzes zero-knowledge proof (ZKP)
    based approaches to multi-party genomic data sharing and builds trust-based sharing
    and privacy-preserving aggregated biomedical analysis on top of them.

- title: "Selective Disclosure of Electronic Health Records"
  keywords: [Sui blockchain, Zero-knowledge smart contracts, Health records, Access control]
  summary: "Traceable sharing of health records on the Sui blockchain with zero-knowledge contracts."
  description: >-
    Secure, traceable transmission of electronic health records on the Sui blockchain,
    with contextual access control and privacy protection through zero-knowledge smart
    contracts, guaranteeing the confidentiality, integrity and traceability of medical data.

- title: "SDN-based Medical IoT Infrastructure"
  keywords: [Software-defined networking, Medical IoT, OpenFlow, Mininet-WiFi]
  summary: "Secure collection of medical IoT data over software-defined hospital networks."
  description: >-
    A secure infrastructure for collecting health data from medical IoT devices, with
    intelligent orchestration for autonomous, adaptive and user-centred software-defined
    networks, evaluated in Mininet-WiFi over OpenFlow.

- title: "Language Agents for IoT Orchestration"
  keywords: [Language agents, IoT, Orchestration]
  summary: "LLMThings: language agents that orchestrate IoT systems."
  description: >-
    LLMThings, an experimentation platform for orchestrating IoT systems with language agents.

- title: "Location Privacy in Multimodal Transportation"
  keywords: [Location privacy, Mobility trajectories, Context awareness]
  summary: "Context-aware protection of mobility trajectories across transport modes."
  description: >-
    An adaptive privacy-preserving system for multimodal mobility trajectories that adjusts
    the level of protection to the user's context and mode of transport.

- title: "Deep Reinforcement Learning for Edge-Cloud Systems"
  keywords: [Deep reinforcement learning, Multi-objective optimisation, Edge-cloud computing]
  summary: "Multi-objective deep reinforcement learning for edge-cloud server selection."
  description: >-
    A multi-objective deep reinforcement learning algorithm for selecting edge-cloud servers,
    improving network routing performance by more than 60% over traditional algorithms.
