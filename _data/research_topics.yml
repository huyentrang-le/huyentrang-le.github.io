# Research topics, shown as cards on the Research page; the first three are
# also listed on the home page. Links to papers, code, slides and demos live
# in the publication entries (assets/ref.bib), not here.
# Each entry needs: title, keywords (methodology and domain, 5-6, no "&"),
#                   tech (languages and tools), summary (one line, for the home page),
#                   description (two or three sentences: problem, method, result)

- title: "Certified Dynamic Reconfiguration of TSN Networks"
  keywords: [Time-Sensitive Networking, Network calculus, Min-plus algebra, Worst-case latency, Traffic shaping, Dynamic reconfiguration]
  tech: [Python, Java, NetworkCalculus.org DNC]
  summary: "Provable worst-case latency bounds that stay certified while TSN networks are reconfigured."
  description: >-
    Time-Sensitive Networking (TSN) promises bounded latency, but measurements only show
    a lower bound on the worst-case delay. My PhD uses deterministic network calculus to
    prove worst-case latency bounds and to keep them certified when the network is
    reconfigured at runtime.

- title: "Secure Genomic Data Sharing with Zero-Knowledge Proofs"
  keywords: [Blockchain, Zero-knowledge proofs, Genomic data, Multi-party sharing, Aggregated biomedical analysis, Privacy]
  tech: [Sui, Move]
  summary: "Zero-knowledge proofs for multi-party genomic data sharing on blockchain."
  description: >-
    Genomic data is shared among hospitals, laboratories and researchers, yet it identifies
    the people it comes from. This work analyses zero-knowledge proof (ZKP) approaches to
    multi-party genomic data sharing on blockchain, and builds trust-based sharing and
    privacy-preserving aggregated biomedical analysis on top of them.

- title: "Selective Disclosure of Electronic Health Records"
  keywords: [Blockchain, Zero-knowledge smart contracts, Selective disclosure, Electronic health records, Access control, Decentralised storage]
  tech: [Sui, Move, Walrus]
  summary: "Traceable sharing of health records on the Sui blockchain with zero-knowledge contracts."
  description: >-
    Electronic health records must reach the right clinician without exposing the whole
    file. This work combines contextual access control in Sui Move smart contracts,
    zero-knowledge contracts that disclose only the attributes needed, and encrypted
    off-chain storage on Walrus, guaranteeing confidentiality, integrity and traceability.

- title: "SDN-based Medical IoT Infrastructure"
  keywords: [Software-defined networking, Medical IoT, Smart hospitals, Network programmability, Network orchestration, Network emulation]
  tech: [Python, Mininet-WiFi, OpenFlow, ONOS]
  summary: "Secure collection of medical IoT data over software-defined hospital networks."
  description: >-
    Medical IoT devices produce sensitive data over heterogeneous hospital networks. This
    work designs a secure collection infrastructure with intelligent orchestration for
    autonomous, adaptive and user-centred software-defined networks, evaluated in
    Mininet-WiFi over OpenFlow.

- title: "Language Agents for IoT Orchestration"
  keywords: [Language agents, Multi-agent systems, Intent-based orchestration, Autonomic computing, MAPE-K, IoT orchestration]
  tech: [Python, Model Context Protocol, ESP32, ZigBee]
  summary: "LLMThings: crews of language agents that orchestrate real IoT deployments from natural-language intents."
  description: >-
    Classical IoT orchestration relies on fixed policies and adapts poorly to unseen
    situations. LLMThings lets crews of language agents, coordinated by strategies such as
    MAPE-K or OODA, turn a natural-language intent into a workflow over devices exposed as
    MCP tools, executed in real time on a nursing-home testbed of ESP32 cameras for fall
    prevention. Best Presentation Award at JDSE 2026.

- title: "Location Privacy in Multimodal Transportation"
  keywords: [Geo-indistinguishability, GPS obfuscation, Location privacy, Trajectory segmentation, Multimodal transportation, Privacy–utility trade-off]
  tech: [Python, Privkit, NumPy, pandas, Matplotlib]
  summary: "Context-aware GPS obfuscation adapted to each transport mode."
  description: >-
    GPS traces reveal homes, workplaces and transport modes. This system splits real-world
    trajectories (Geolife) by transport mode and obfuscates them with geo-indistinguishability
    mechanisms tuned to each mode, measuring the privacy–utility trade-off with Privkit:
    Velocity-Aware Geo-Ind kept distortion mostly below 50 m, against about 120 m for the
    Planar Laplace baseline. M1 internship at the University of Porto.

- title: "Deep Reinforcement Learning for Edge-Cloud Systems"
  keywords: [Deep reinforcement learning, Multi-objective optimisation, Edge-cloud computing, Server selection, Network routing]
  tech: [Python, TensorFlow, OpenAI Gym, NumPy]
  summary: "Multi-objective deep reinforcement learning for edge-cloud server selection."
  description: >-
    Choosing which edge or cloud server handles a request trades off latency, load and cost.
    This work proposes a multi-objective deep reinforcement learning algorithm for
    edge-cloud server selection, improving network routing performance by more than 60%
    over traditional algorithms.
